<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheler's English Cabinet: Daily Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-2:#2E4374;
    --paper:#F5EFE1;
    --paper-2:#EDE4CF;
    --gold:#C9A227;
    --gold-dim:#9c8020;
    --sage:#5f8566;
    --rose:#b45c52;
    --wood:#3a2c22;
    --wood-2:#54402f;
    --muted:#8892a8;
    --shadow: 0 20px 50px -20px rgba(9,14,30,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #223357 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #24365e 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 60px;
  }
  .masthead{ text-align:center; margin-bottom:26px; }
  .masthead .eyebrow{
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); font-weight:600;
  }
  .masthead h1{
    font-family:'Lora',serif; font-weight:600;
    font-size:clamp(24px,4vw,34px); margin:6px 0 2px; color:var(--paper);
  }
  .masthead .fa-title{
    font-family:'Vazirmatn',sans-serif; direction:rtl; color:var(--muted); font-size:15px;
  }

  /* ---- Signature element: card cabinet with 5 drawers ---- */
  .cabinet{
    display:flex; gap:10px;
    background:linear-gradient(180deg,var(--wood-2),var(--wood));
    padding:14px; border-radius:14px;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04);
    margin-bottom:30px; max-width:920px; width:100%;
  }
  .drawer{
    flex:1;
    background:linear-gradient(180deg,#e9dfc4,#ded2ae);
    border-radius:8px; padding:10px 8px 12px; text-align:center; position:relative;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -6px 10px -4px rgba(0,0,0,.25), 0 3px 0 rgba(0,0,0,.25);
    transition:transform .35s ease, box-shadow .35s ease;
    transform-origin:top;
  }
  .drawer .handle{ width:26px;height:5px;border-radius:3px; background:var(--gold-dim); margin:0 auto 8px; }
  .drawer .label{
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--wood); font-weight:700; opacity:.75;
  }
  .drawer .count{
    font-family:'Lora',serif; font-size:22px; font-weight:600; color:var(--ink); margin-top:2px;
  }
  .drawer .interval{ font-size:10px; color:var(--wood-2); opacity:.7; margin-top:2px; }
  .drawer.active{
    transform:translateY(6px) scale(1.04);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 10px -4px rgba(0,0,0,.3), 0 8px 16px -6px rgba(201,162,39,.55);
  }
  .drawer.active::after{
    content:''; position:absolute; inset:-3px; border-radius:10px;
    border:1.5px solid var(--gold); pointer-events:none;
  }
  .drawer.pulse{ animation: pulseDrawer .6s ease; }
  @keyframes pulseDrawer{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(10px) scale(1.07); }
    100%{ transform:translateY(6px) scale(1.04); }
  }

  .status-line{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
    font-size:13px; color:var(--muted); margin-bottom:22px;
  }
  .status-line b{ color:var(--paper); font-weight:600; }

  .stage{ width:100%; max-width:640px; }
  .card{
    background:var(--paper); color:var(--ink); border-radius:18px;
    padding:38px 32px 30px; box-shadow:var(--shadow); position:relative;
    min-height:260px; display:flex; flex-direction:column;
    animation: riseIn .4s ease;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card::before{
    content:''; position:absolute; top:0; left:24px; right:24px; height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    border-radius:0 0 3px 3px;
  }
  .box-tag{
    align-self:flex-end; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--gold-dim); background:rgba(201,162,39,.12);
    border:1px solid rgba(201,162,39,.35); padding:3px 10px; border-radius:20px;
    margin-bottom:14px; font-family:'Inter',sans-serif; font-weight:600;
  }
  .fa-sentence{
    font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right;
    font-size:clamp(21px,3.4vw,26px); line-height:1.9; font-weight:500;
    color:var(--ink); margin-bottom:20px;
  }
  .divider{ border:none; border-top:1px dashed #cfc2a2; margin:6px 0 20px; }
  .answer-zone{ display:none; }
  .answer-zone.show{ display:block; animation: riseIn .3s ease; }
  .en-sentence-row{
    display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;
  }
  .en-sentence{
    font-family:'Lora',serif; font-style:italic;
    font-size:clamp(18px,2.6vw,21px); line-height:1.6; color:var(--ink-2);
    margin:0; flex:1;
  }

  /* ---- Speaker / read-aloud button ---- */
  .speak-btn{
    flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    border:none; cursor:pointer; padding:0;
    box-shadow:0 2px 6px rgba(27,42,74,.25);
    transition:transform .15s ease, background .15s ease;
  }
  .speak-btn svg{ width:14px; height:14px; }
  .speak-btn:hover{ background:var(--ink-2); transform:scale(1.06); }
  .speak-btn:active{ transform:scale(.94); }
  .speak-btn.speaking{ background:var(--gold-dim); animation:speakPulse 1s ease-in-out infinite; }
  @keyframes speakPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(201,162,39,.45); }
    50%{ box-shadow:0 0 0 6px rgba(201,162,39,0); }
  }
  .speak-btn-sm{ width:22px; height:22px; }
  .speak-btn-sm svg{ width:11px; height:11px; }
  .no-tts-note{
    font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:14px;
  }

  .masthead .deck-sub{
    font-family:'Lora',serif; font-style:italic; color:var(--paper-2);
    opacity:.8; font-size:15px; margin-bottom:4px;
  }
  /* ---- Key word from the 504 book ---- */
  .kw-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .kw-label{ font-size:12px; color:var(--muted); font-weight:500; }
  .kw{
    font-family:'Lora',serif; font-weight:600; font-size:15px;
    color:var(--ink); background:rgba(201,162,39,.16);
    border:1px solid rgba(201,162,39,.45); border-radius:6px; padding:2px 10px;
  }

  /* ---- Alternative phrasings ---- */
  .alt-block{ margin-bottom:18px; }
  .alt-title{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:700; margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .alt-title::before{ content:'≈'; font-size:13px; }
  .alt-list{ display:flex; flex-direction:column; gap:6px; }
  .alt-item-row{ display:flex; align-items:center; gap:8px; }
  .alt-item{
    font-family:'Lora',serif; font-style:italic; font-size:14.5px;
    color:#5b6a86; padding:7px 12px; background:#eef1f6;
    border-left:3px solid var(--ink-2); border-radius:6px; line-height:1.5;
    flex:1; margin:0;
  }

  .breakdown-title{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:700; margin-bottom:8px;
  }
  .breakdown{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chunk{
    background:var(--paper-2); border:1px solid #ddd0af; border-radius:9px;
    padding:6px 10px; font-size:13px; line-height:1.4;
    display:flex; flex-direction:column; align-items:center; min-width:64px;
  }
  .chunk .cfa{ font-family:'Vazirmatn',sans-serif; direction:rtl; font-weight:600; color:var(--ink); }
  .chunk-en-row{ display:flex; align-items:center; gap:4px; margin-top:2px; }
  .chunk .cen{ font-family:'Inter',sans-serif; color:var(--ink-2); font-size:11.5px; }

  .controls{ margin-top:24px; }
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    border:none; border-radius:11px; padding:13px 20px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    width:100%;
  }
  .btn:active{ transform:scale(.98); }
  .btn-reveal{ background:var(--ink); color:var(--paper); }
  .btn-reveal:hover{ background:var(--ink-2); }
  .self-assess{ display:flex; gap:12px; }
  .btn-wrong{ background:#f1e2df; color:var(--rose); box-shadow:inset 0 0 0 1.5px rgba(180,92,82,.4); }
  .btn-wrong:hover{ background:#eed3ce; }
  .btn-right{ background:#e3ece4; color:var(--sage); box-shadow:inset 0 0 0 1.5px rgba(95,133,102,.4); }
  .btn-right:hover{ background:#d7e5d9; }

  .empty-state{ text-align:center; padding:50px 20px; }
  .empty-state .big{ font-family:'Lora',serif; font-size:22px; margin-bottom:8px; }
  .empty-state .small{ color:var(--muted); font-size:13.5px; }
  .empty-state .fa-small{
    font-family:'Vazirmatn',sans-serif; direction:rtl; margin-top:10px; color:var(--muted); font-size:14px;
  }

  .footer-row{ margin-top:26px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
  .link-btn{
    background:none; border:none; color:var(--muted); font-size:12.5px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:'Inter',sans-serif;
  }
  .link-btn:hover{ color:var(--paper); }

  /* ---- Voice picker ---- */
  .voice-panel{
    width:100%; max-width:640px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:18px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .voice-panel label{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold); font-weight:600; white-space:nowrap;
  }
  .voice-panel select{
    flex:1; min-width:160px;
    background:var(--paper); color:var(--ink);
    border:1px solid #ddd0af; border-radius:8px;
    padding:7px 10px; font-family:'Inter',sans-serif; font-size:13px;
    cursor:pointer;
  }
  .voice-panel .try-btn{
    flex-shrink:0;
    background:var(--gold-dim); color:var(--ink);
    border:none; border-radius:8px; padding:7px 14px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
    cursor:pointer; transition:background .15s ease;
  }
  .voice-panel .try-btn:hover{ background:var(--gold); }
  .voice-panel .voice-hint{
    width:100%; font-size:11.5px; color:var(--muted); line-height:1.5;
  }

  @media (max-width:520px){
    .cabinet{ gap:6px; padding:10px; }
    .drawer{ padding:8px 4px 10px; }
    .drawer .count{ font-size:18px; }
    .card{ padding:28px 20px 24px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

/* =========================================================
   1b. READ-ALOUD (Web Speech API, built into the browser)
   -----------------------------------------------------------
   Voice quality is entirely up to the browser/OS; we can't
   ship our own voice, but we CAN pick the best one available
   and let Sheler switch if she prefers a different one.
   ========================================================= */
const SPEAKER_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 9v6h4l5 5V4L8 9H4z"/>
  <path d="M16.6 12c0-1.77-.77-3.3-2.02-4.24l0 8.47c1.25-.93 2.02-2.46 2.02-4.23z"/>
  <path d="M14.6 4.5v2.02c2.9 1.06 5 3.85 5 7.13s-2.1 6.07-5 7.13v2.02c4-.15 7.2-3.53 7.2-9.15s-3.2-9-7.2-9.15z" opacity=".55"/>
</svg>`;

const TTS_SUPPORTED = ('speechSynthesis' in window);
const VOICE_STORAGE_KEY = 'sheler_tts_voice_uri';
let availableVoices = [];
let selectedVoiceURI = localStorage.getItem(VOICE_STORAGE_KEY) || null;

function speakBtnHtml(role, i, size){
  const cls = size === 'sm' ? 'speak-btn speak-btn-sm' : 'speak-btn';
  return `<button type="button" class="${cls}" data-role="${role}" data-i="${i}" aria-label="Play pronunciation" title="Listen">${SPEAKER_SVG}</button>`;
}

// Rank voices so the most natural-sounding ones (cloud/"Neural"/"Online"
// voices most browsers ship alongside the old robotic default) sort first.
function scoreVoice(v){
  const name = v.name.toLowerCase();
  let score = 0;
  if(v.lang === 'en-US') score += 3;
  else if(v.lang === 'en-GB') score += 2;
  else if(v.lang.startsWith('en')) score += 1;
  if(/natural|neural|online|premium|enhanced|plus/.test(name)) score += 6;
  if(/google/.test(name)) score += 3;
  if(/samantha|aria|jenny|guy|ava|serena|nicky/.test(name)) score += 2;
  if(v.localService === false) score += 1; // cloud voices are usually higher quality
  return score;
}

function loadVoices(){
  if(!TTS_SUPPORTED) return;
  const all = window.speechSynthesis.getVoices();
  availableVoices = all.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  if(availableVoices.length === 0) availableVoices = all; // fallback, better than nothing
  populateVoicePanel();
}

function populateVoicePanel(){
  const sel = document.getElementById('voiceSelect');
  const hint = document.getElementById('voiceHint');
  if(!sel) return;
  if(!TTS_SUPPORTED){
    document.getElementById('voicePanel').style.display = 'none';
    return;
  }
  if(availableVoices.length === 0){
    sel.innerHTML = `<option>Loading voices…</option>`;
    return;
  }
  const ranked = [...availableVoices].sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  sel.innerHTML = ranked.map(v=>
    `<option value="${v.voiceURI}">${v.name} (${v.lang})${v.localService===false ? ' (online)' : ''}</option>`
  ).join('');
  const stillExists = selectedVoiceURI && ranked.some(v=>v.voiceURI===selectedVoiceURI);
  selectedVoiceURI = stillExists ? selectedVoiceURI : ranked[0].voiceURI;
  sel.value = selectedVoiceURI;
  hint.textContent = 'Voices marked "online" or "Natural/Neural" usually sound the least robotic. Pick whichever is clearest for you.';
}

function getSelectedVoice(){
  return availableVoices.find(v=>v.voiceURI === selectedVoiceURI) || null;
}

function speakText(text, btn){
  if(!TTS_SUPPORTED) return;
  window.speechSynthesis.cancel(); // stop anything currently playing
  const utter = new SpeechSynthesisUtterance(text);
  const voice = getSelectedVoice();
  if(voice){ utter.voice = voice; utter.lang = voice.lang; }
  else { utter.lang = 'en-US'; }
  utter.rate = 0.95;   // a touch slower, easier for a learner to follow
  utter.pitch = 1;
  if(btn) btn.classList.add('speaking');
  const clear = ()=>{ if(btn) btn.classList.remove('speaking'); };
  utter.onend = clear;
  utter.onerror = clear;
  window.speechSynthesis.speak(utter);
}

function wireSpeakButtons(sentence){
  if(!TTS_SUPPORTED){
    document.querySelectorAll('.speak-btn').forEach(b=>{ b.style.display='none'; });
    return;
  }
  document.querySelectorAll('.speak-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const role = btn.dataset.role;
      const i = parseInt(btn.dataset.i, 10);
      let text = '';
      if(role === 'main') text = sentence.en;
      else if(role === 'kw') text = sentence.w;
      else if(role === 'alt') text = sentence.alt[i];
      else if(role === 'chunk') text = sentence.bd[i][1];
      if(text) speakText(text, btn);
    });
  });
}

if(TTS_SUPPORTED){
  loadVoices();
  // Most browsers load voices asynchronously; this fires when the real list is ready.
  window.speechSynthesis.onvoiceschanged = loadVoices;

  document.getElementById('voiceSelect').addEventListener('change', (e)=>{
    selectedVoiceURI = e.target.value;
    localStorage.setItem(VOICE_STORAGE_KEY, selectedVoiceURI);
  });
  document.getElementById('tryVoiceBtn').addEventListener('click', (e)=>{
    speakText("Hi Sheler, this is what this voice sounds like.", e.currentTarget);
  });
} else {
  document.getElementById('voicePanel').style.display = 'none';
}

/* =========================================================
   2. LEITNER SYSTEM CONFIG
   ========================================================= */
const BOX_COUNT = 5;
const INTERVAL_DAYS = [0, 1, 3, 7, 14]; // days until due, indexed by box (1-5 -> index 0-4)
const STORAGE_KEY = 'sheler_leitner_progress_daily_talk_v1';

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Could not read progress', e); }
  const fresh = {};
  SENTENCES.forEach((s,i)=>{ fresh[i] = { box:1, due: todayStr() }; });
  return fresh;
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

let progress = loadProgress();
SENTENCES.forEach((s,i)=>{ if(!progress[i]) progress[i] = { box:1, due: todayStr() }; });
saveProgress();

/* =========================================================
   3. QUEUE MANAGEMENT
   ========================================================= */
let todayQueue = [];
let currentId = null;
let revealed = false;

function buildTodayQueue(){
  const t = todayStr();
  todayQueue = Object.keys(progress)
    .map(k=>parseInt(k))
    .filter(id => progress[id].due <= t);
  shuffle(todayQueue);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
function nextCard(){
  revealed = false;
  if(TTS_SUPPORTED) window.speechSynthesis.cancel();
  if(todayQueue.length === 0){
    currentId = null;
    renderEmpty();
    renderCabinet();
    renderStatus();
    return;
  }
  currentId = todayQueue[0];
  renderCard();
  renderCabinet();
  renderStatus();
}

/* =========================================================
   4. RENDERING
   ========================================================= */
const cardEl = document.getElementById('card');
const cabinetEl = document.getElementById('cabinet');
const statusEl = document.getElementById('statusLine');

function renderCabinet(){
  const counts = new Array(BOX_COUNT).fill(0);
  Object.values(progress).forEach(p=> counts[p.box-1]++ );
  const activeBox = currentId!==null ? progress[currentId].box : null;
  cabinetEl.innerHTML = counts.map((c,i)=>{
    const boxNum = i+1;
    const isActive = boxNum === activeBox;
    const intervalLabel = INTERVAL_DAYS[i] === 0 ? 'same day' : `${INTERVAL_DAYS[i]}d`;
    return `<div class="drawer ${isActive?'active':''}" data-box="${boxNum}">
      <div class="handle"></div>
      <div class="label">Box ${boxNum}</div>
      <div class="count">${c}</div>
      <div class="interval">${intervalLabel}</div>
    </div>`;
  }).join('');
}

function renderStatus(){
  const total = SENTENCES.length;
  const t = todayStr();
  const dueTotal = Object.values(progress).filter(p=>p.due<=t).length;
  const mastered = Object.values(progress).filter(p=>p.box===BOX_COUNT).length;
  statusEl.innerHTML =
    `<span><b>${todayQueue.length}</b> left today</span>` +
    `<span><b>${dueTotal}</b> due overall</span>` +
    `<span><b>${mastered}</b> mastered (Box ${BOX_COUNT})</span>` +
    `<span><b>${total}</b> total cards</span>`;
}

function renderCard(){
  const s = SENTENCES[currentId];
  const p = progress[currentId];
  const altHtml = (s.alt && s.alt.length) ? `
    <div class="alt-block">
      <div class="alt-title">Alternative phrasings</div>
      <div class="alt-list">
        ${s.alt.map((a,i)=>`
          <div class="alt-item-row">
            <div class="alt-item">${a}</div>
            ${speakBtnHtml('alt', i, 'sm')}
          </div>`).join('')}
      </div>
    </div>` : '';
  cardEl.innerHTML = `
    <div class="box-tag">Box ${p.box} of ${BOX_COUNT}</div>
    <div class="fa-sentence">${s.fa}</div>
    <hr class="divider">
    <div class="answer-zone" id="answerZone">
      ${s.w ? `<div class="kw-row"><span class="kw-label">Key word</span><span class="kw">${s.w}</span>${speakBtnHtml('kw', 0, 'sm')}</div>` : ''}
      <div class="en-sentence-row">
        <div class="en-sentence">${s.en}</div>
        ${speakBtnHtml('main', 0, '')}
      </div>
      ${altHtml}
      <div class="breakdown-title">Word by word</div>
      <div class="breakdown">
        ${s.bd.map((pair,i)=>`
          <div class="chunk">
            <span class="cfa">${pair[0]}</span>
            <span class="chunk-en-row">
              <span class="cen">${pair[1]}</span>
              ${speakBtnHtml('chunk', i, 'sm')}
            </span>
          </div>`).join('')}
      </div>
    </div>
    <div class="controls" id="controlsZone">
      <button class="btn btn-reveal" id="revealBtn">Show answer</button>
    </div>
  `;
  document.getElementById('revealBtn').addEventListener('click', showAnswer);
  wireSpeakButtons(s);
}

function showAnswer(){
  revealed = true;
  document.getElementById('answerZone').classList.add('show');
  const controls = document.getElementById('controlsZone');
  controls.innerHTML = `
    <div class="breakdown-title" style="margin-bottom:10px;">Did you get this right or wrong?</div>
    <div class="self-assess">
      <button class="btn btn-wrong" id="wrongBtn">Wrong</button>
      <button class="btn btn-right" id="rightBtn">Right</button>
    </div>
  `;
  document.getElementById('wrongBtn').addEventListener('click', ()=>answer(false));
  document.getElementById('rightBtn').addEventListener('click', ()=>answer(true));
}

function renderEmpty(){
  cardEl.innerHTML = `
    <div class="empty-state">
      <div class="big">All done for today 🎉</div>
      <div class="small">No cards are due right now. Come back later, or reset to practice again.</div>
      <div class="fa-small">همه‌ی جمله‌های امروز را تمام کردی</div>
    </div>
  `;
}

/* =========================================================
   5. ANSWER LOGIC (Leitner rules)
   ========================================================= */
function answer(isRight){
  const p = progress[currentId];
  const drawerEl = document.querySelector(`.drawer[data-box="${p.box}"]`);
  if(drawerEl){ drawerEl.classList.add('pulse'); setTimeout(()=>drawerEl.classList.remove('pulse'),650); }

  if(isRight){
    p.box = Math.min(p.box + 1, BOX_COUNT);
    p.due = addDays(todayStr(), INTERVAL_DAYS[p.box-1]);
    todayQueue.shift();
  } else {
    p.box = 1;
    p.due = todayStr();
    todayQueue.shift();
    todayQueue.push(currentId);
  }
  saveProgress();
  setTimeout(nextCard, 180);
}

/* =========================================================
   6. RESET
   ========================================================= */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Reset all progress and start over from Box 1?')) return;
  const fresh = {};
  SENTENCES.forEach((s,i)=>{ fresh[i] = { box:1, due: todayStr() }; });
  progress = fresh;
  saveProgress();
  buildTodayQueue();
  nextCard();
});

/* =========================================================
   7. INIT
   ========================================================= */
buildTodayQueue();
nextCard();
</script>
